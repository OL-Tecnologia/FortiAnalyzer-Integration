<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — FortiAnalyzer</title>
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div class="page page-narrow">
    <header class="header header-center">
      <div class="brand">
        <span class="brand-tag">OL Tecnologia</span>
        <h1>Acesso FortiAnalyzer</h1>
      </div>
      <a
        class="btn-icon header-admin-link"
        href="/admin.html"
        title="Administração Super Admin"
        aria-label="Administração Super Admin"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </header>

    <main class="card">
      <p class="lead">
        Selecione o cliente e informe suas credenciais do FortiAnalyzer. Depois do acesso, escolha qual relatório gerar.
      </p>

      <form id="loginForm" class="login-form" autocomplete="on">
        <p class="adom-line" id="loginAdomHint">Carregando cliente…</p>
        <label class="field" id="clientField">
          <span>Cliente</span>
          <select id="loginClient" name="client" autocomplete="off" required></select>
        </label>
        <label class="field">
          <span>Usuário FAZ</span>
          <input type="text" id="loginUser" name="user" required autocomplete="username" />
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" id="loginPassword" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="btnLogin">
          Entrar
        </button>
      </form>

      <p class="error hidden" id="loginError"></p>
    </main>

    <footer class="footer">
      <span>FortiAnalyzer → PDF</span>
    </footer>
  </div>
  <script src="login.js?v=4"></script>
</body>
</html>
